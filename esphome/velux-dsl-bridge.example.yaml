# ESPHome Velux DSL bridge using a Heltec WiFi LoRa 32 V3 (SX1262).
#
# Enrollment is intentionally manual and device-specific: power-cycle only
# the blind being enrolled, then press its enrollment button within the
# component's enrollment window. Do not rename blind IDs after enrollment;
# the radio address is derived from the ID.

esphome:
  name: velux-bridge
  friendly_name: Velux Bridge

esp32:
  board: heltec_wifi_lora_32_V3
  variant: esp32s3
  flash_size: 8MB
  framework:
    type: esp-idf

logger:
  level: DEBUG
  hardware_uart: UART0

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Velux-Bridge Fallback"
    password: !secret fallback_password

captive_portal:

api:
  encryption:
    key: !secret api_encryption_key

web_server:
  port: 80

ota:
  - platform: esphome
    password: !secret ota_password

# Review and pin this dependency before using the example in production.
external_components:
  - source: github://laberning/home_io_control
    refresh: 0s

# Heltec V3 radio SPI bus.
spi:
  clk_pin: GPIO9
  mosi_pin: GPIO10
  miso_pin: GPIO11

home_io_control:
  radio_type: sx1262
  cs_pin: GPIO8
  rst_pin: GPIO12
  busy_pin: GPIO13
  dio1_pin: GPIO14
  tcxo_voltage: 1_8V
  node_id: !secret io_node_id
  system_key: !secret io_system_key
  oneway_controllers:
    - id: blind_1
      manufacturer: somfy
      io_device_type: unknown
      execute_acei: 0x61
      commands: [open, close, stop]
      enrollment: true
      low_power: true
    - id: blind_2
      manufacturer: somfy
      io_device_type: unknown
      execute_acei: 0x61
      commands: [open, close, stop]
      enrollment: true
      low_power: true
    - id: blind_3
      manufacturer: somfy
      io_device_type: unknown
      execute_acei: 0x61
      commands: [open, close, stop]
      enrollment: true
      low_power: true
    - id: blind_4
      manufacturer: somfy
      io_device_type: unknown
      execute_acei: 0x61
      commands: [open, close, stop]
      enrollment: true
      low_power: true
