all:
  vars:
    ha_url: "http://YOUR_HOME_ASSISTANT_HOST:8123"
    ha_ssh_user: "YOUR_SSH_USER"
    ha_ssh_port: 22
    ha_config_root: "/config"
  hosts:
    homeassistant:
      ansible_host: "YOUR_HOME_ASSISTANT_HOST"
      ansible_user: "YOUR_SSH_USER"
      ansible_port: 22
      ansible_connection: ssh
